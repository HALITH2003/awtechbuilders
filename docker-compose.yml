version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aw_postgres
    restart: always
    environment:
      POSTGRES_USER: aw_user
      POSTGRES_PASSWORD: aw_password
      POSTGRES_DB: aw_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aw_user -d aw_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
